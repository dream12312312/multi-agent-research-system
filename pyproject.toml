[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-system"
version = "0.1.0"
description = "Expert-level multi-agent research assistant with MCP, LangGraph, Langfuse and configuration optimization."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38,<2",
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
  "langchain-huggingface>=0.1,<2",
  "huggingface-hub>=0.24,<2",
  "mcp>=1.0,<2",
  "tavily-python>=0.5,<1",
  "langfuse>=2.0,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "tenacity>=8.5,<10",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
